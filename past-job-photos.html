<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Job Photos | FS Property Solutions</title>
    <meta name="description" content="Explore before and after photos of pressure washing jobs by FS Property Solutions in Puerto Rico.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans text-gray-800 antialiased bg-blue-50">
    <header class="bg-white shadow-md">
        <nav aria-label="Main navigation" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
            <a href="index.html" aria-label="FS Property PR home">
                <img src="FSpropertypr Nav Logo.png" alt="FS Property PR Logo" class="h-16 w-auto">
            </a>
            <a href="index.html" class="inline-flex min-h-[44px] items-center bg-blue-900 hover:bg-blue-700 text-white font-semibold px-5 py-3 rounded-lg focus-visible:outline focus-visible:outline-4 focus-visible:outline-blue-500">← Back to Home</a>
        </nav>
    </header>
    <main>
    <!-- Past pressure washing jobs -->
    <section id="past-job-photos" aria-labelledby="past-job-photos-title" class="py-16 bg-blue-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-10">
                <h2 id="past-job-photos-title" class="text-3xl font-bold text-blue-900 mb-4">Past Job Photos</h2>
                <p class="text-gray-600">See the difference from our pressure washing work. Select a photo to view it full size.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <figure class="bg-white rounded-xl shadow overflow-hidden">
                    <a href="images/past-jobs-pressure-wash/driveway-before-after.jpg" target="_blank" rel="noopener" class="block focus-visible:outline focus-visible:outline-4 focus-visible:outline-blue-600" aria-label="View driveway before and after photo full size (opens in a new tab)">
                        <img src="images/past-jobs-pressure-wash/driveway-before-after.jpg" alt="Driveway before and after pressure washing" loading="lazy" decoding="async" class="w-full h-auto">
                    </a>
                    <figcaption class="p-5 font-semibold text-blue-900">Driveway <span class="block text-sm font-normal text-gray-600 mt-1">Before &amp; After</span></figcaption>
                </figure>
                <figure class="bg-white rounded-xl shadow overflow-hidden">
                    <a href="images/past-jobs-pressure-wash/pavers-fountain-before-after.jpg" target="_blank" rel="noopener" class="block focus-visible:outline focus-visible:outline-4 focus-visible:outline-blue-600" aria-label="View pavers and fountain before and after photo full size (opens in a new tab)">
                        <img src="images/past-jobs-pressure-wash/pavers-fountain-before-after.jpg" alt="Pavers and Fountain before and after pressure washing" loading="lazy" decoding="async" class="w-full h-auto">
                    </a>
                    <figcaption class="p-5 font-semibold text-blue-900">Pavers and Fountain <span class="block text-sm font-normal text-gray-600 mt-1">Before &amp; After</span></figcaption>
                </figure>
                <figure class="bg-white rounded-xl shadow overflow-hidden">
                    <a href="images/past-jobs-pressure-wash/paver-path-before-after.jpg" target="_blank" rel="noopener" class="block focus-visible:outline focus-visible:outline-4 focus-visible:outline-blue-600" aria-label="View paver path before and after photo full size (opens in a new tab)">
                        <img src="images/past-jobs-pressure-wash/paver-path-before-after.jpg" alt="Paver Path before and after pressure washing" loading="lazy" decoding="async" class="w-full h-auto">
                    </a>
                    <figcaption class="p-5 font-semibold text-blue-900">Paver Path <span class="block text-sm font-normal text-gray-600 mt-1">Before &amp; After</span></figcaption>
                </figure>
            </div>
        </div>
    </section>
        <div class="text-center px-4 pb-16">
            <a href="index.html" class="inline-flex min-h-[44px] items-center text-blue-900 font-semibold underline underline-offset-4 px-4 py-3">← Back to Home</a>
        </div>
    </main>
    <footer class="bg-blue-900 text-white text-center px-4 py-6 text-sm">
        <p>&copy; 2026 FS Property Solutions. All rights reserved.</p>
    </footer>
